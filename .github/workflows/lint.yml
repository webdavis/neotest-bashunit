name: Lint
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lint and test tools
        env:
          BASHUNIT_COMMIT: "683ba16f54fee391dc30bea0a5e6201aeef72c19"
          BASHUNIT_SHA256: "429a0f25cf39b2779e3266b4a5bb2c098cb5ebed60d9a3476a1fea3c5acc7a49"
        run: |
          set -euo pipefail
          brew install bash jq luacheck neovim shfmt stylua
          mkdir -p "$RUNNER_TEMP/bin"
          git clone --quiet --no-checkout --filter=blob:none https://github.com/TypedDevs/bashunit.git "$RUNNER_TEMP/bashunit-source"
          git -C "$RUNNER_TEMP/bashunit-source" checkout --quiet --detach "$BASHUNIT_COMMIT"
          test "$(git -C "$RUNNER_TEMP/bashunit-source" rev-parse HEAD)" = "$BASHUNIT_COMMIT"
          (cd "$RUNNER_TEMP/bashunit-source" && ./build.sh "$RUNNER_TEMP/bin")
          printf '%s  %s\n' "$BASHUNIT_SHA256" "$RUNNER_TEMP/bin/bashunit" | shasum -a 256 -c -
          chmod 0755 "$RUNNER_TEMP/bin/bashunit"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check Lua formatting
        run: stylua --check lua tests
      - name: Lint Lua
        run: luacheck lua tests --globals vim --no-max-line-length
      - name: Run Lua tests
        run: nvim --headless --clean -l tests/run.lua
